name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    # Dependabot cannot sign off; its commits are generated by GitHub.
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ vars.CI_LINUX_RUNNER || ((endsWith(github.run_number, '1') || endsWith(github.run_number, '4') || endsWith(github.run_number, '7')) && 'sengi-basic-2-ubuntu-2404') || 'avrea-ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: git fetch origin "${{ github.base_ref }}" --depth=1
      - run: node tooling/ci/check-dco.mjs "origin/${{ github.base_ref }}..HEAD"
