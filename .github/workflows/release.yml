name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    # Free organization Linux runners (Sengi / Avrea).
    runs-on: ${{ vars.CI_LINUX_RUNNER || ((endsWith(github.run_number, '1') || endsWith(github.run_number, '4') || endsWith(github.run_number, '7')) && 'sengi-basic-2-ubuntu-2404') || 'avrea-ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint:licenses
      - run: pnpm build
      - run: pnpm package:chrome
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-release
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-release
          path: coverage/
          if-no-files-found: warn

  safari:
    # Free organization macOS runner; needs Xcode for the Safari archive.
    runs-on: ${{ fromJSON(vars.CI_MACOS_RUNNER_JSON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 40
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm safari:project
      - run: pnpm package:safari
      - uses: actions/upload-artifact@v4
        with:
          name: safari-release-unsigned
          path: artifacts/safari/
          if-no-files-found: error
