name: release-chrome

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-chrome-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chrome:
    # Chrome-only local-save packaging. The build disables App handoff and drops
    # contextMenus/commands; Safari remains a separate manual workflow.
    runs-on: ${{ vars.CI_LINUX_RUNNER || ((endsWith(github.run_number, '1') || endsWith(github.run_number, '4') || endsWith(github.run_number, '7')) && 'sengi-basic-2-ubuntu-2404') || 'avrea-ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint:licenses
      - run: pnpm package:chrome:store
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-release
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-release
          path: coverage/
          if-no-files-found: warn
