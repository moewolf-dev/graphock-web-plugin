name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    # Linux Chromium functional suite. This is the required check for every PR,
    # including forks, so a skipped macOS job cannot satisfy the gate.
    runs-on: ${{ vars.CI_LINUX_RUNNER || ((endsWith(github.run_number, '1') || endsWith(github.run_number, '4') || endsWith(github.run_number, '7')) && 'sengi-basic-2-ubuntu-2404') || 'avrea-ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm qa:linux
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-linux
          path: playwright-report/
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-linux
          path: test-results/
          if-no-files-found: ignore

  visual:
    # Darwin visual baselines and full suite on the trusted macOS runner.
    # Fork PRs are excluded because self-hosted runners must not execute them.
    runs-on: ${{ fromJSON(vars.CI_MACOS_RUNNER_JSON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx playwright@1.65.1 install chromium
      - run: pnpm qa
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-macos
          path: playwright-report/
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-macos
          path: test-results/
          if-no-files-found: ignore
